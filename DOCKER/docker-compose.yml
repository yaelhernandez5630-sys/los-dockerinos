
version: '3.8'
services:
  worker-1:
    build:
      context: ..
      dockerfile: DOCKER/Dockerfile
    container_name: rust_worker_1
    network_mode: "host"
    environment:
      # 🔧 AJUSTAR según tu IP de VPN
      - COORDINATOR_ENDPOINT=10.10.10.1:3000  # Cambiar X por tu IP
      - WORKER_ID=worker-gabolectric-1
    command: ["./mandelbrot_distribuido", "worker"]
    restart: unless-stopped

